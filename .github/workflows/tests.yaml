name: Tests

# When to run this workflow
on:
  push:
    branches: [ GHcheck ]
    # Trigger only when relevant files change
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'

  pull_request:
    branches: [ GHcheck ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'

  # Run weekly to catch bitrot / ecosystem changes
  schedule:
    - cron: '0 0 * * 0'

# ------------------------------------------------------------
# Linting using pre-commit
# ------------------------------------------------------------
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Run pre-commit hooks
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --show-diff-on-failure --all-files

# ------------------------------------------------------------
# Build with NumPy 2.x, Test with NumPy 1.x (ABI compatibility check)
# ------------------------------------------------------------
  numpy_compat_test:
    runs-on: ubuntu-latest
    name: Build with NumPy 2.0, test with 1.24
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        gdal-version: ['3.8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up system packages and Python ${{ matrix.python-version }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common \
            python${{ matrix.python-version }} \
            python${{ matrix.python-version }}-dev \
            python${{ matrix.python-version }}-venv \
            python3-pip \
            g++

      - name: Build wheel using NumPy 2.x
        run: |
          python${{ matrix.python-version }} -m venv testenv
          source testenv/bin/activate
          pip install --upgrade pip
          pip install numpy==2.0.0 build
          python -m build  # Create wheel from source

      - name: Run tests using NumPy 1.x
        run: |
          source testenv/bin/activate
          pip install numpy==1.24
          pip install -r requirements-dev.txt
          pip install dist/*.whl
          pip install aiohttp boto3 fsspec hypothesis packaging pytest shapely
          rm -rf rasterio  # Ensure tests run against installed wheel, not source
          pytest -v -m "not wheel" -rxXs

# ------------------------------------------------------------
# Docker-based matrix: Test across GDAL versions and Python versions
# ------------------------------------------------------------
  docker_tests:
    needs: linting
    runs-on: ubuntu-latest
    name: Docker | GDAL=${{ matrix.gdal-version }} | python=${{ matrix.python-version }}
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        gdal-version: ['3.9.3']
        include:
          # Add more combinations
          - python-version: '3.12'
            gdal-version: 'latest'
          - python-version: '3.9'
            gdal-version: '3.8.5'
          - python-version: '3.9'
            gdal-version: '3.7.3'
          - python-version: '3.9'
            gdal-version: '3.6.4'
          - python-version: '3.9'
            gdal-version: '3.5.3'

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }} and dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common \
            python${{ matrix.python-version }} \
            python${{ matrix.python-version }}-dev \
            python${{ matrix.python-version }}-venv \
            python3-pip \
            g++

      - name: Set up virtual environment and install test deps
        run: |
          python${{ matrix.python-version }} -m venv testenv
          source testenv/bin/activate
          pip install --upgrade pip
          pip install --no-deps --force-reinstall -e .[test]

      - name: Run pytest with coverage
        run: |
          source testenv/bin/activate
          pip install -r requirements-dev.txt
          pytest -v -m "not wheel" -rxXs --cov rasterio --cov-report term-missing

# ------------------------------------------------------------
# Conda-based tests on macOS and Linux (Mamba)
# ------------------------------------------------------------
  conda_test:
    needs: linting
    name: Conda | ${{ matrix.os }} | python=${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-13, macos-14]  # Intel and Apple Silicon
        python-version: ['3.9', '3.10', '3.11', '3.12']
        include:
          - os: ubuntu-latest
            python-version: '*'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda environment via micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}
            libgdal
            geos=3.11
            cython=3
            numpy

      - name: Install test dependencies (editable install)
        shell: bash -l {0}
        run: |
          micromamba run -n test pip install -e . --no-use-pep517 || micromamba run -n test pip install -e .
          micromamba run -n test pip install -r requirements-dev.txt

      - name: Log Python and environment info
        shell: bash -l {0}
        run: |
          micromamba run -n test python -V
          micromamba info

      - name: Run tests with coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          micromamba run python -m pytest -v -m "not wheel" -rxXs --cov rasterio --cov-report term-missing -k "not issue2353"

      - name: Run tests with coverage (macOS only)
        if: ${{ matrix.os == 'macos-13' || matrix.os == 'macos-14' }}
        shell: bash -l {0}
        run: |
          micromamba run python -m pytest -v -m "not wheel" -rxXs --cov rasterio --cov-report term-missing \
            -k "not test_target_aligned_pixels and not test_reproject_error_propagation and not test_outer_boundless_pixel_fidelity and not issue2353"
