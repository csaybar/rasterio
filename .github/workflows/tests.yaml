# =============================================================================
# Rasterio Test Suite
# =============================================================================
# This workflow provides comprehensive testing for the Rasterio geospatial library
# across multiple Python versions, GDAL versions, and operating systems.
#
# Testing Strategy:
# 1. Code Quality: Linting with pre-commit hooks
# 2. NumPy Compatibility: Build with NumPy 2.x, test with 1.x (ABI compatibility)
# 3. Cross-platform Docker Tests: Multiple GDAL/Python combinations on Ubuntu
# 4. Conda Environment Tests: Native builds on macOS (Intel/Apple Silicon) and Ubuntu
#
# Triggers:
# - Push/PR to main branch (with path filtering for efficiency)
# - Weekly scheduled runs to catch ecosystem changes
# =============================================================================

name: Tests

# =============================================================================
# WORKFLOW TRIGGERS
# =============================================================================
on:
  push:
    branches: [ GHcheck ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'
  pull_request:
    branches: [ GHcheck ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================
env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

# =============================================================================
# JOB DEFINITIONS
# =============================================================================
jobs:
  # ===========================================================================
  # JOB 1: CODE QUALITY AND LINTING
  # ===========================================================================
  # Purpose: Ensure code quality standards using pre-commit hooks
  # - Runs on latest Ubuntu with Python 3.12
  # - Uses pre-commit to run configured linting tools (black, flake8, etc.)
  # - Acts as a gatekeeper for other jobs - they depend on this passing
  # ===========================================================================
  linting:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: "🔍 Run pre-commit hooks"
        shell: bash
        run: |
          echo "Installing pre-commit..."
          python -m pip install --upgrade pip
          python -m pip install pre-commit
          echo "Running pre-commit hooks on all files..."
          pre-commit run --show-diff-on-failure --color=always --all-files


  # ===========================================================================
  # JOB 2: NUMPY ABI COMPATIBILITY TEST
  # ===========================================================================
  # Purpose: Critical test for NumPy ABI compatibility
  # - Build Rasterio with NumPy 2.0 (newer ABI)
  # - Test with NumPy 1.24 (older ABI) 
  # - Ensures users with older NumPy can use newer Rasterio wheels
  # - Uses specific GDAL container for consistent geospatial environment
  # ===========================================================================
  numpy_compat_test:
    name: "NumPy ABI Compatibility Test"
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 30

    # Use specific GDAL version for reproducible results
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.9.3

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHON_VERSION: '3.10'
      NUMPY_BUILD_VERSION: '2.2.6'
      NUMPY_TEST_VERSION: '1.24'
      # Fix PROJ configuration
      PROJ_LIB: /usr/share/proj
      GDAL_DATA: /usr/share/gdal
      PROJ_NETWORK: ON
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🔧 Install system dependencies and Python ${{ env.PYTHON_VERSION }}"
        run: |
          echo "Updating package lists..."
          apt-get update -qq
          echo "Installing Python ${{ env.PYTHON_VERSION }} and build dependencies..."
          apt-get install -y --no-install-recommends \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            g++ \
            pkg-config \
            proj-data \
            proj-bin \
            libproj-dev \
            ca-certificates \
            curl
          echo "Verifying PROJ installation..."
          proj --version || echo "PROJ command not found"
          echo "PROJ_LIB contents:"
          ls -la /usr/share/proj/ || echo "PROJ_LIB directory not found"
      - name: "🏗️ Build wheel with NumPy ${{ env.NUMPY_BUILD_VERSION }}"
        run: |
          echo "Creating build environment..."
          python3 -m venv testenv
          . testenv/bin/activate
          echo "Upgrading pip and installing build dependencies..."
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==${{ env.NUMPY_BUILD_VERSION }} build cython
          echo "Building wheel from source..."
          python -m build --wheel
          echo "Built wheels:"
          ls -la dist/
      - name: "🧪 Test with NumPy ${{ env.NUMPY_TEST_VERSION }}"
        run: |
          echo "Activating test environment..."
          . testenv/bin/activate
          echo "Installing NumPy ${{ env.NUMPY_TEST_VERSION }} for testing..."
          python -m pip install numpy==${{ env.NUMPY_TEST_VERSION }}
          echo "Installing development requirements..."
          python -m pip wheel -r requirements-dev.txt
          echo "Installing built wheel..."
          python -m pip install dist/*.whl
          echo "Installing additional test dependencies..."
          python -m pip install aiohttp boto3 fsspec hypothesis packaging pytest shapely
          echo "Verifying PROJ configuration..."
          python -c "
                import os
                print('PROJ_LIB:', os.environ.get('PROJ_LIB', 'Not set'))
                print('GDAL_DATA:', os.environ.get('GDAL_DATA', 'Not set'))
                try:
                    import rasterio
                    from rasterio.crs import CRS
                    print('CRS creation test:', CRS.from_epsg(4326))
                    print('PROJ network:', rasterio.env.default_env.options.get('PROJ_NETWORK', 'Not set'))
                except Exception as e:
                    print('Error:', e)
          "
          echo "Removing source directory to ensure testing against installed wheel..."
          rm -rf rasterio
          echo "Running NumPy compatibility tests..."
          python -m pytest -v -m "not wheel" -rxXs --tb=short

  # ===========================================================================
  # JOB 3: DOCKER-BASED MATRIX TESTS
  # ===========================================================================
  # Purpose: Testing across GDAL and Python version combinations
  # - Uses official GDAL Docker containers for consistent environments
  # - Tests all supported Python versions (3.9-3.13) in the current GDAL stable release
  # - Tests multiple GDAL versions for compatibility
  # - Includes coverage reporting for code quality metrics
  # ===========================================================================
  docker_tests:
    name: "Docker | GDAL=${{ matrix.gdal-version }} | Python=${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 45
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    env:
      DEBIAN_FRONTEND: noninteractive
      GDAL_DATA: /usr/share/gdal
      PROJ_LIB: /usr/share/proj
      PROJ_NETWORK: ON
      # Disable problematic PROJ network calls if needed
      PROJ_CURL_ENABLED: 'YES'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        gdal-version: ['3.9.3']
        include:
          - python-version: '3.12'
            gdal-version: 'latest'
            enable_coverage: true
          - python-version: '3.10'
            gdal-version: '3.8.5'
          - python-version: '3.10'
            gdal-version: '3.7.3'
          - python-version: '3.10'
            gdal-version: '3.6.4'
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🔧 Install system dependencies and Python ${{ env.PYTHON_VERSION }}"
        run: |
          echo "Updating package lists..."
          apt-get update -qq
          echo "Installing Python ${{ env.PYTHON_VERSION }} and build dependencies..."
          apt-get install -y --no-install-recommends \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            g++ \
            pkg-config \
            dbus \
            proj-data \
            proj-bin \
            libproj-dev \
            ca-certificates \
            curl
          echo "Starting DBus service (if available)..."
          service dbus start || true
          echo "Checking /etc/resolv.conf symlink..."
          if [ ! -L /etc/resolv.conf ]; then
              ln -sf /lib/systemd/systemd-resolved.service /etc/resolv.conf || true
          fi
          echo "Verifying PROJ installation..."
          proj --version || echo "PROJ command not found"
          echo "PROJ_LIB contents:"
          ls -la /usr/share/proj/ || echo "PROJ_LIB directory not found"
          echo "Verifying coordinate transformation capability..."
          echo "-78.0 23.0" | proj +proj=utm +zone=18 +datum=WGS84 || echo "PROJ transformation test failed"
      - name: "🏗️ Set up virtual environment and install package"
        run: |
          echo "Creating virtual environment with Python ${{ matrix.python-version }}..."
          python3 -m venv testenv
          . testenv/bin/activate
          echo "Upgrading pip and core packages..."
          python -m pip install --upgrade pip setuptools wheel
          echo "Installing Rasterio in development mode..."
          python -m pip install --no-deps --force-reinstall -e .[test]
          echo "Environment info:"
          python --version
          pip --version
      - name: "🔍 Verify geospatial environment"
        run: |
          . testenv/bin/activate
          echo "Testing PROJ and GDAL integration..."
          python -c "
import os
import rasterio
from rasterio.crs import CRS
from rasterio.warp import transform
print('Environment variables:')
print('  PROJ_LIB:', os.environ.get('PROJ_LIB', 'Not set'))
print('  GDAL_DATA:', os.environ.get('GDAL_DATA', 'Not set'))
print('  PROJ_NETWORK:', os.environ.get('PROJ_NETWORK', 'Not set'))

print('\\nTesting CRS operations:')
try:
    crs = CRS.from_epsg(4326)
    print('  WGS84 CRS creation: OK')
    crs_utm = CRS.from_epsg(32618)
    print('  UTM Zone 18N CRS creation: OK')
except Exception as e:
    print('  CRS creation failed:', e)

print('\\nTesting coordinate transformation:')
try:
    xs, ys = transform(CRS.from_epsg(4326), CRS.from_epsg(32618), [-78.0], [23.0])
    print(f'  Transform result: [{xs[0]:.2f}, {ys[0]:.2f}]')
    print('  Coordinate transformation: OK')
except Exception as e:
    print('  Transformation failed:', e)
"
      - name: "🧪 Run tests"
        run: |
          . testenv/bin/activate
          echo "Installing development requirements..."
          python -m pip install -r requirements-dev.txt
          if [ "${{ matrix.enable_coverage }}" = "true" ]; then
            echo "Running tests with coverage reporting..."
            python -m pytest -v -m "not wheel" -rxXs \
              --cov=rasterio \
              --cov-report=term-missing \
              --cov-report=xml \
              --tb=short
          else
            echo "Running tests without coverage..."
            python -m pytest -v -m "not wheel" -rxXs \
              --cov=rasterio \
              --cov-report=term-missing \
              --tb=short
          fi
      - name: "📊 Upload coverage to Codecov"
        if: matrix.enable_coverage == true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: docker-tests
          name: docker-gdal-${{ matrix.gdal-version }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # ===========================================================================
  # JOB 4: CONDA ENVIRONMENT TESTS
  # ===========================================================================
  # Purpose: Test in conda/mamba environments across different platforms
  # - Tests on macOS (Intel + Apple Silicon) and Ubuntu
  # - Uses micromamba for faster, more reliable environment setup
  # - Validates against conda-forge ecosystem packages
  # - Platform-specific test exclusions for known platform issues
  # ===========================================================================
  conda_test:
    name: "Conda | ${{ matrix.os }} | Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    needs: linting
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [macos-13, macos-14]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        include:
          - os: ubuntu-latest
            python-version: '*'
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🐍 Setup Conda environment with micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}
            libgdal
            geos=3.11
            cython=3
            numpy
            proj-data
      - name: "📦 Install Rasterio and test dependencies"
        shell: bash -l {0}
        run: |
          echo "Installing Rasterio in development mode..."
          micromamba run -n test python -m pip install -e . --no-use-pep517 || \
          micromamba run -n test python -m pip install -e .
          echo "Installing development requirements..."
          micromamba run -n test python -m pip install -r requirements-dev.txt
      - name: "🔍 Environment diagnostics"
        shell: bash -l {0}
        run: |
          echo "Python version:"
          micromamba run -n test python -V
          echo "Micromamba environment info:"
          micromamba info
          echo "Installed packages:"
          micromamba run -n test pip list | grep -E "(rasterio|gdal|numpy|geos)"
          echo "Testing geospatial environment:"
          micromamba run -n test python -c "
import os
import rasterio
from rasterio.crs import CRS
print('PROJ_LIB:', os.environ.get('PROJ_LIB', 'Not set'))
print('GDAL_DATA:', os.environ.get('GDAL_DATA', 'Not set'))
try:
    crs = CRS.from_epsg(4326)
    print('CRS test: OK')
except Exception as e:
    print('CRS test failed:', e)
"
      - name: "🧪 Run tests (Ubuntu)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          echo "Running tests on Ubuntu..."
          micromamba run python -m pytest -v -m "not wheel" -rxXs \
            --cov=rasterio \
            --cov-report=term-missing \
            -k "not issue2353" \
            --tb=short
      - name: "🧪 Run tests (macOS)"
        if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
        shell: bash -l {0}
        run: |
          echo "Running tests on macOS (${{ matrix.os }})..."
          micromamba run python -m pytest -v -m "not wheel" -rxXs \
            --cov=rasterio \
            --cov-report=term-missing \
            -k "not test_target_aligned_pixels and not test_reproject_error_propagation and not test_outer_boundless_pixel_fidelity and not issue2353" \
            --tb=short