name: Tests

on:
  push:
    branches: [ GHcheck ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'
  pull_request:
    branches: [ GHcheck ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'rasterio/**'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  linting:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: "🔍 Run pre-commit hooks"
        shell: bash
        run: |
          echo "Installing pre-commit..."
          python -m pip install --upgrade pip
          python -m pip install pre-commit
          echo "Running pre-commit hooks on all files..."
          pre-commit run --show-diff-on-failure --color=always --all-files

  numpy_compat_test:
    name: "NumPy ABI Compatibility Test"
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 30
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.5.3
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHON_VERSION: '3.10'
      NUMPY_BUILD_VERSION: '2.0.0'
      NUMPY_TEST_VERSION: '1.24'
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🔧 Install system dependencies and Python ${{ env.PYTHON_VERSION }}"
        run: |
          echo "Updating package lists..."
          apt-get update -qq
          echo "Installing Python ${{ env.PYTHON_VERSION }} and build dependencies..."
          apt-get install -y --no-install-recommends \
            python${{ env.PYTHON_VERSION }} \
            python${{ env.PYTHON_VERSION }}-dev \
            python${{ env.PYTHON_VERSION }}-venv \
            python3-pip \
            g++ \
            pkg-config
      - name: "🏗️ Build wheel with NumPy ${{ env.NUMPY_BUILD_VERSION }}"
        run: |
          echo "Creating build environment..."
          python${{ env.PYTHON_VERSION }} -m venv testenv
          . testenv/bin/activate
          echo "Upgrading pip and installing build dependencies..."
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==${{ env.NUMPY_BUILD_VERSION }} build cython
          echo "Building wheel from source..."
          python -m build --wheel
          echo "Built wheels:"
          ls -la dist/
      - name: "🧪 Test with NumPy ${{ env.NUMPY_TEST_VERSION }}"
        run: |
          echo "Activating test environment..."
          . testenv/bin/activate
          echo "Installing NumPy ${{ env.NUMPY_TEST_VERSION }} for testing..."
          python -m pip install numpy==${{ env.NUMPY_TEST_VERSION }}
          echo "Installing development requirements..."
          python -m pip wheel -r requirements-dev.txt
          echo "Installing built wheel..."
          python -m pip install dist/*.whl
          echo "Installing additional test dependencies..."
          python -m pip install aiohttp boto3 fsspec hypothesis packaging pytest shapely
          echo "Removing source directory to ensure testing against installed wheel..."
          rm -rf rasterio
          echo "Running NumPy compatibility tests..."
          python -m pytest -v -m "not wheel" -rxXs --tb=short

  docker_tests:
    name: "Docker | GDAL=${{ matrix.gdal-version }} | Python=${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 45
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        gdal-version: ['3.9.3']
        include:
          - python-version: '3.12'
            gdal-version: 'latest'
            enable_coverage: true
          - python-version: '3.9'
            gdal-version: '3.8.5'
          - python-version: '3.9'
            gdal-version: '3.7.3'
          - python-version: '3.9'
            gdal-version: '3.6.4'
          - python-version: '3.9'
            gdal-version: '3.5.3'
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🔧 Install system dependencies and Python ${{ matrix.python-version }}"
        run: |
          echo "Adding deadsnakes PPA for Python ${{ matrix.python-version }}..."
          apt-get update -qq
          apt-get install -y --no-install-recommends software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          echo "Installing Python ${{ matrix.python-version }} and build dependencies..."
          apt-get install -y --no-install-recommends \
            python${{ matrix.python-version }} \
            python${{ matrix.python-version }}-dev \
            python${{ matrix.python-version }}-venv \
            python3-pip \
            g++ \
            pkg-config \
            git
      - name: "🏗️ Set up virtual environment and install package"
        run: |
          echo "Creating virtual environment with Python ${{ matrix.python-version }}..."
          python${{ matrix.python-version }} -m venv testenv
          . testenv/bin/activate
          echo "Upgrading pip and core packages..."
          python -m pip install --upgrade pip setuptools wheel
          echo "Installing Rasterio in development mode..."
          python -m pip install --no-deps --force-reinstall -e .[test]
          echo "Environment info:"
          python --version
          pip --version
      - name: "🧪 Run tests"
        run: |
          . testenv/bin/activate
          echo "Installing development requirements..."
          python -m pip install -r requirements-dev.txt
          if [ "${{ matrix.enable_coverage }}" = "true" ]; then
            echo "Running tests with coverage reporting..."
            python -m pytest -v -m "not wheel" -rxXs \
              --cov=rasterio \
              --cov-report=term-missing \
              --cov-report=xml \
              --tb=short
          else
            echo "Running tests without coverage..."
            python -m pytest -v -m "not wheel" -rxXs \
              --cov=rasterio \
              --cov-report=term-missing \
              --tb=short
          fi
      - name: "📊 Upload coverage to Codecov"
        if: matrix.enable_coverage == true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: docker-tests
          name: docker-gdal-${{ matrix.gdal-version }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  conda_test:
    name: "Conda | ${{ matrix.os }} | Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    needs: linting
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [macos-13, macos-14]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        include:
          - os: ubuntu-latest
            python-version: '*'
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "🐍 Setup Conda environment with micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}
            libgdal
            geos=3.11
            cython=3
            numpy
      - name: "📦 Install Rasterio and test dependencies"
        shell: bash -l {0}
        run: |
          echo "Installing Rasterio in development mode..."
          micromamba run -n test python -m pip install -e . --no-use-pep517 || \
          micromamba run -n test python -m pip install -e .
          echo "Installing development requirements..."
          micromamba run -n test python -m pip install -r requirements-dev.txt
      - name: "🔍 Environment diagnostics"
        shell: bash -l {0}
        run: |
          echo "Python version:"
          micromamba run -n test python -V
          echo "Micromamba environment info:"
          micromamba info
          echo "Installed packages:"
          micromamba run -n test pip list | grep -E "(rasterio|gdal|numpy|geos)"
      - name: "🧪 Run tests (Ubuntu)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          echo "Running tests on Ubuntu..."
          micromamba run python -m pytest -v -m "not wheel" -rxXs \
            --cov=rasterio \
            --cov-report=term-missing \
            -k "not issue2353" \
            --tb=short
      - name: "🧪 Run tests (macOS)"
        if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
        shell: bash -l {0}
        run: |
          echo "Running tests on macOS (${{ matrix.os }})..."
          micromamba run python -m pytest -v -m "not wheel" -rxXs \
            --cov=rasterio \
            --cov-report=term-missing \
            -k "not test_target_aligned_pixels and not test_reproject_error_propagation and not test_outer_boundless_pixel_fidelity and not issue2353" \
            --tb=short
